name: E2E Testing

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - 'feature/**'
    types:
      - opened
      - reopened
      - synchronize

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  e2e-test:
    name: WP ${{ matrix.wordpress }}${{ matrix.experimental && ' (experimental)' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        wordpress: [ '6.1', 'latest' ]
        experimental: [false]
        include:
          - wordpress: 'trunk'
            experimental: true
    env:
      WP_ENV_CORE: ${{ matrix.wordpress == 'trunk' && 'WordPress/WordPress' || format( 'https://wordpress.org/wordpress-{0}.zip', matrix.wordpress ) }}
    continue-on-error: ${{ matrix.experimental == true }}
    steps:
      - uses: styfle/cancel-workflow-action@85880fa0301c86cca9da44039ee3bb12d3bedbfa

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js (via .nvmrc)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: npm install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Playwright dependencies
        run: npx playwright install chromium firefox webkit --with-deps

      - name: Install WordPress
        run: npm run wp-env start

      - name: Running e2e tests
        run: npm run test-e2e

      - name: Archive debug artifacts (screenshots, traces)
        uses: actions/upload-artifact/merge@ea165f8d65b6e75b540449e92b4886f43607fa02
        # Don't fail the job if there aren't any artifacts to merge.
        continue-on-error: true
        with:
            name: failures-artifacts
            # Retain the merged artifacts in case of a rerun.
            pattern: failures-artifacts*
            delete-merged: true